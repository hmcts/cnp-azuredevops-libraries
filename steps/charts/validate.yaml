parameters:
  serviceConnection: "DCD-CFTAPPS-DEV"
  registryServiceConnection: "azurerm-prod"
  acrName: "hmctsprod"
  chartName: ""
  chartReleaseName: ""
  chartNamespace: ""
  chartPath: "./"
  createNamespace: false
  helmVersion: "3.17.1"
  helmInstallTimeout: "120"
  helmTestTimeout: "300"
  helmDeleteWait: "0"
  helmInstallWait: "0"
  valuesFile: "ci-values.yaml"
  additionalHelmArgs: ""
  aksResourceGroup: ""
  aksCluster: ""
  kubeconformValuesFile: ""
  kubernetesVersion: "1.35.0"
  kubeconformVersion: "v0.6.7"
  # Fallback -schema-location kubeconform tries for CRDs not covered by the built-in k8s
  # schemas or by the auto-generated ASO schemas below (e.g. KEDA). Override to point at
  # a fork/mirror or a static schema file if a chart's CRD is missing or out of date.
  kubeconformCrdSchemaLocation: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
  # ASO release to source local CRD schemas from for any ASO CRD groups detected in the rendered chart
  asoVersion: "v2.17.0"
  asoSchemaRoot: "$(Agent.TempDirectory)/aso-schemas"
  runSnapshotTests: false
  runUnitTests: false
  unitTestFile: ""
  helmUnittestValuesFile: "ci-values-minimal.yaml"
  helmUnittestVersion: "v0.8.0"
  clustersToCheck:
    - aksResourceGroupName: cft-preview-00-rg
      aksClusterName: cft-preview-00-aks
      aksEnvironment: preview
    - aksResourceGroupName: cft-preview-01-rg
      aksClusterName: cft-preview-01-aks
      aksEnvironment: preview

steps:

  - checkout: self
    clean: true

  - checkout: cnp-azuredevops-libraries
    clean: true

  - template: ../set-build-repo-suffix-env-var.yaml

  - task: HelmInstaller@1
    displayName: 'Install Helm ${{parameters.helmVersion}}'
    inputs:
      helmVersionToInstall: ${{parameters.helmVersion}}

  - ${{ if eq(parameters.aksCluster, '') }}:
    - ${{ each cluster in parameters.clustersToCheck}} :
      - task: AzureCLI@2
        displayName: "Checking if ${{ cluster.aksClusterName }} is Active"
        name: CheckActiveCluster_${{ replace(cluster.aksClusterName, '-', '_') }}
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptPath: $(System.DefaultWorkingDirectory)/cnp-azuredevops-libraries/scripts/auto-detect-cluster.sh
          scriptArguments: --resourceGroupName ${{ cluster.aksResourceGroupName }} --aksClusterName ${{ cluster.aksClusterName }} --environmentName ${{ cluster.aksEnvironment }}

  - task: AzureCLI@2
    displayName: "AKS Authenticate"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptLocation: "inlineScript"
      scriptType: bash
      ${{ if ne(parameters.aksCluster, '') }}:
        inlineScript: az aks get-credentials --admin --resource-group ${{ parameters.aksResourceGroup }} --name ${{ parameters.aksCluster }}
      ${{ else }}:
        inlineScript: az aks get-credentials --admin --resource-group $(aksResourceGroup) --name $(aksCluster)

  - task: AzureCLI@2
    displayName: "ACR Login for Helm"
    inputs:
      azureSubscription: ${{ parameters.registryServiceConnection }}
      scriptLocation: "inlineScript"
      scriptType: bash
      workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
      inlineScript: |
        export HELM_EXPERIMENTAL_OCI=1
        az acr login --name ${{parameters.acrName}}

  - script: |
      if [ "${{ parameters.chartPath }}" = "./" ]; then
        CHART_TARGET="${{ parameters.chartName }}"
      else
        CHART_PATH_TRIMMED="${{ parameters.chartPath }}"
        CHART_PATH_TRIMMED="${CHART_PATH_TRIMMED%/}"
        CHART_NAME_TRIMMED="${{ parameters.chartName }}"
        CHART_NAME_TRIMMED="${CHART_NAME_TRIMMED#/}"
        CHART_TARGET="${CHART_PATH_TRIMMED}/${CHART_NAME_TRIMMED}"
      fi

      echo "Resolved chart target: ${CHART_TARGET}"
      echo "##vso[task.setvariable variable=chartTarget]${CHART_TARGET}"
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Resolve chart target and namespace options"

  - script: |
      echo "Chart Path: ${{ parameters.chartPath }}"
      echo "Chart Target: $(chartTarget)"
      echo "Working Dir: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)"
      ls -l
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Provide useful information"

  - script: |
      if [ "${{ parameters.createNamespace }}" != "true" ]; then
        echo "Namespace creation disabled for this run."
        echo "##vso[task.setvariable variable=namespaceCreatedByPipeline]false"
        echo "##vso[task.setvariable variable=namespaceManagedByPipeline]false"
        echo "##vso[task.setvariable variable=deletePreviousRelease]true"
        exit 0
      fi

      if kubectl get namespace ${{ parameters.chartNamespace }} >/dev/null 2>&1; then
        echo "Namespace ${{ parameters.chartNamespace }} already exists."
        PIPELINE_LABEL=$(kubectl get namespace ${{ parameters.chartNamespace }} -o jsonpath='{.metadata.labels.cnp\.validate/template}' 2>/dev/null || true)
        echo "##vso[task.setvariable variable=namespaceCreatedByPipeline]false"
        if [ "$PIPELINE_LABEL" = "true" ]; then
          echo "Namespace ${{ parameters.chartNamespace }} is managed by validation pipeline."
          echo "##vso[task.setvariable variable=namespaceManagedByPipeline]true"
          echo "##vso[task.setvariable variable=deletePreviousRelease]true"
        else
          echo "Namespace ${{ parameters.chartNamespace }} is not pipeline-managed. Reusing namespace, will clean up helm release only."
          echo "##vso[task.setvariable variable=namespaceManagedByPipeline]false"
          echo "##vso[task.setvariable variable=deletePreviousRelease]true"
        fi
      else
        echo "Creating namespace ${{ parameters.chartNamespace }} for validation run."
        kubectl create namespace ${{ parameters.chartNamespace }}
        kubectl label namespace ${{ parameters.chartNamespace }} cnp.validate/template=true cnp.validate/build-id=$(Build.BuildId) --overwrite
        echo "##vso[task.setvariable variable=namespaceCreatedByPipeline]true"
        echo "##vso[task.setvariable variable=namespaceManagedByPipeline]true"
        echo "##vso[task.setvariable variable=deletePreviousRelease]false"
      fi
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Create namespace for validation"

  - script: helm delete --namespace ${{ parameters.chartNamespace }} ${{ parameters.chartReleaseName }} --wait || true
    condition: eq(variables['deletePreviousRelease'], 'true')
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Delete Previous Test Chart"

  - script: helm dependency update $(chartTarget)
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Retrieve helm dependencies (if any)"

  - script: |
      ls -Rla $(chartTarget)
      helm lint $(chartTarget)
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Helm Lint"

  # `default` (built-in k8s schemas) is always tried first, followed by any ASO CRD
  # schemas generated locally from the rendered chart, then the configurable fallback.
  - ${{ if ne(parameters.kubeconformValuesFile, '') }}:
    - script: |
        set -e -o pipefail
        curl -sSL https://github.com/yannh/kubeconform/releases/download/${{ parameters.kubeconformVersion }}/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp/
        helm template ${{ parameters.chartReleaseName }} $(chartTarget) \
          -f ${{ parameters.valuesFile }} \
          -f ${{ parameters.kubeconformValuesFile }} \
          > "$(Agent.TempDirectory)/rendered-manifest.yaml"
      workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
      displayName: "Render chart manifests for kubeconform"

    - script: |
        set -euo pipefail

        # Auto-detect which ASO CRD groups (if any) the chart actually renders, so
        # consumers don't need to know/declare their chart's ASO CRD groups up front.
        # NOTE: variable is intentionally not named GROUPS - bash treats that as a special
        # read-only array (the process's Unix group IDs) and aborts immediately on assignment.
        ASO_GROUPS=$(grep -h '^apiVersion:' "$(Agent.TempDirectory)/rendered-manifest.yaml" \
          | awk '{print $2}' \
          | cut -d/ -f1 \
          | grep '\.azure\.com$' \
          | sort -u || true)

        if [ -z "$ASO_GROUPS" ]; then
          echo "No ASO CRD groups detected in rendered manifest, skipping local schema generation."
          exit 0
        fi
        echo "Detected ASO CRD groups: $ASO_GROUPS"

        python3 -m venv "$(Agent.TempDirectory)/aso-venv"
        "$(Agent.TempDirectory)/aso-venv/bin/pip" install --quiet pyyaml

        curl -sfL "https://github.com/Azure/azure-service-operator/releases/download/${{ parameters.asoVersion }}/azureserviceoperator_customresourcedefinitions_${{ parameters.asoVersion }}.yaml" \
          -o "$(Agent.TempDirectory)/aso-crds.yaml"

        # Fetched fresh each run so upstream fixes/CRD-version support land automatically.
        curl -sfL https://raw.githubusercontent.com/yannh/kubeconform/master/scripts/openapi2jsonschema.py \
          -o "$(Agent.TempDirectory)/openapi2jsonschema.py"

        cat > "$(Agent.TempDirectory)/generate-aso-schema.py" <<'PYEOF'
        import importlib.util
        import sys

        import yaml

        bundle_path, upstream_path, group = sys.argv[1], sys.argv[2], sys.argv[3]

        spec = importlib.util.spec_from_file_location("openapi2jsonschema", upstream_path)
        upstream = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(upstream)  # `__main__` guard means this only defines functions

        def additional_properties(data, skip=False):
            "This recreates the behaviour of kubectl at https://github.com/kubernetes/kubernetes/blob/225b9119d6a8f03fcbe3cc3d590c261965d928d0/pkg/kubectl/validation/schema.go#L312"
            if isinstance(data, dict):
                if "properties" in data and not skip:
                    if "additionalProperties" not in data:
                        data["additionalProperties"] = False
                for k, v in data.items():
                    if k == "properties" and isinstance(v, dict):
                        # v is a {field name: schema} map, not a schema itself - a CRD field can
                        # legitimately be named "properties", so don't recurse into v as a whole.
                        for field_schema in v.values():
                            additional_properties(field_schema)
                    else:
                        additional_properties(v)
            return data

        # Patches out a bug in the upstream function of the same name: it doesn't special-case
        # CRD fields literally named "properties", so it mistakes a field's own schema for the
        # enclosing object's {field name: schema} map and corrupts it with a stray key.
        upstream.additional_properties = additional_properties

        with open(bundle_path) as f:
            for doc in yaml.safe_load_all(f):
                if not doc or doc.get("kind") != "CustomResourceDefinition":
                    continue
                if doc["spec"]["group"] != group:
                    continue
                for version in doc["spec"].get("versions", []):
                    schema = version.get("schema", {}).get("openAPIV3Schema")
                    if not schema:
                        continue
                    filename = "{kind}_{version}.json".format(
                        kind=doc["spec"]["names"]["kind"], version=version["name"]
                    ).lower()
                    upstream.write_schema_file(schema, filename)
        PYEOF

        SCHEMA_ROOT="${{ parameters.asoSchemaRoot }}"
        mkdir -p "$SCHEMA_ROOT"

        for ASO_GROUP in $ASO_GROUPS; do
          GROUP_DIR="$SCHEMA_ROOT/$ASO_GROUP"
          mkdir -p "$GROUP_DIR"
          (cd "$GROUP_DIR" && "$(Agent.TempDirectory)/aso-venv/bin/python3" "$(Agent.TempDirectory)/generate-aso-schema.py" "$(Agent.TempDirectory)/aso-crds.yaml" "$(Agent.TempDirectory)/openapi2jsonschema.py" "$ASO_GROUP")
        done

        echo "Generated schema files:"
        find "$SCHEMA_ROOT" -type f | sort
      workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
      displayName: "Generate ASO CRD schemas from rendered manifest (bypasses datreeio catalog bugs)"

    - script: |
        set -e -o pipefail
        /tmp/kubeconform \
          -strict \
          -summary \
          -kubernetes-version ${{ parameters.kubernetesVersion }} \
          -schema-location default \
          -schema-location '${{ parameters.asoSchemaRoot }}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          -schema-location '${{ parameters.kubeconformCrdSchemaLocation }}' \
          < "$(Agent.TempDirectory)/rendered-manifest.yaml"

      workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
      displayName: "Kubeconform strict validation"

  - ${{ if eq(parameters.runSnapshotTests, true) }}:
    - script: |
        VALUES_FILE="$(System.DefaultWorkingDirectory)/$(buildRepoSuffix)/${{ parameters.valuesFile }}"
        UNITTEST_VALUES_FILE="$(System.DefaultWorkingDirectory)/$(buildRepoSuffix)/${{ parameters.helmUnittestValuesFile }}"

        DESIRED_VERSION="${{ parameters.helmUnittestVersion }}"
        # lowercase the version string
        DESIRED_VERSION="${DESIRED_VERSION,,}"
        CURRENT_VERSION=$(helm plugin list 2>/dev/null | awk '$1=="unittest" {print $2}')

        if [ "$CURRENT_VERSION" != "${DESIRED_VERSION#v}" ]; then
          helm plugin uninstall unittest >/dev/null 2>&1 || true
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$DESIRED_VERSION" >/tmp/helm-unittest-install.log 2>&1 || {
            cat /tmp/helm-unittest-install.log
            exit 1
          }
        fi

        INSTALLED_VERSION=$(helm plugin list | awk '$1=="unittest" {print $2}')
        echo "Installed version ${INSTALLED_VERSION:-unknown} of plugin helm-unittest"

        helm unittest $(chartTarget) \
          --values "$VALUES_FILE" \
          --values "$UNITTEST_VALUES_FILE" \
          -f 'tests/snapshot-tests/*.yaml'
      workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
      displayName: "helm-unittest snapshot tests"

  - ${{ if eq(parameters.runUnitTests, true) }}:
    - script: |
        VALUES_FILE="$(System.DefaultWorkingDirectory)/$(buildRepoSuffix)/${{ parameters.valuesFile }}"
        UNITTEST_VALUES_FILE="$(System.DefaultWorkingDirectory)/$(buildRepoSuffix)/${{ parameters.helmUnittestValuesFile }}"

        DESIRED_VERSION="${{ parameters.helmUnittestVersion }}"
        # lowercase the version string
        DESIRED_VERSION="${DESIRED_VERSION,,}"
        CURRENT_VERSION=$(helm plugin list 2>/dev/null | awk '$1=="unittest" {print $2}')

        if [ "$CURRENT_VERSION" != "${DESIRED_VERSION#v}" ]; then
          helm plugin uninstall unittest >/dev/null 2>&1 || true
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$DESIRED_VERSION" >/tmp/helm-unittest-install.log 2>&1 || {
            cat /tmp/helm-unittest-install.log
            exit 1
          }
        fi

        INSTALLED_VERSION=$(helm plugin list | awk '$1=="unittest" {print $2}')
        echo "Installed version ${INSTALLED_VERSION:-unknown} of plugin helm-unittest"
        
        # capture the unit test file parameter into a variable to avoid issues with quoting and special characters
        read -r UNIT_TEST_FILE <<'EOF'
          ${{ parameters.unitTestFile }}
        EOF
        UNIT_TEST_FILES="tests/unit-tests/*_test.yaml"
        if [[ -n "$UNIT_TEST_FILE" ]]; then 
         # this is to block values like `../../somefile` or `somefile; rm -rf /` from being passed in. 
         # Only allow alphanumeric, dot, underscore, and hyphen characters in the unitTestFile parameter.
         [[ "$UNIT_TEST_FILE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid unitTestFile: $UNIT_TEST_FILE"; exit 1; }; 
         UNIT_TEST_FILES="tests/unit-tests/$UNIT_TEST_FILE"; 
        fi

        helm unittest $(chartTarget) \
          --values "$VALUES_FILE" \
          --values "$UNITTEST_VALUES_FILE" \
          -f "$UNIT_TEST_FILES"
      workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
      displayName: "helm-unittest assertion tests"

  - script: helm install ${{ parameters.chartReleaseName }} $(chartTarget) --namespace ${{ parameters.chartNamespace }} -f ${{ parameters.valuesFile }} --wait --timeout ${{ parameters.helmInstallTimeout }}s ${{ parameters.additionalHelmArgs }}
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Helm Install"

  - script: sleep ${{ parameters.helmInstallWait }}
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Wait for chart resources to be provisioned"

  - script: |
      # Run helm test without --logs (doesn't work with Job-based tests)
      helm test --namespace ${{ parameters.chartNamespace }} ${{ parameters.chartReleaseName }} --timeout ${{ parameters.helmTestTimeout }}s

      # Get logs from test resources
      echo ""
      echo "==================== Test Logs ===================="

      # Find test jobs created by this release (first try by label)
      TEST_JOBS=$(kubectl get jobs -n ${{ parameters.chartNamespace }} \
        -l "app.kubernetes.io/instance=${{ parameters.chartReleaseName }}" \
        -o json | jq -r '.items[] | select(.metadata.annotations."helm.sh/hook" == "test") | .metadata.name')

      if [ -z "$TEST_JOBS" ]; then
        # Fallback: search by name prefix if labels aren't present
        TEST_JOBS=$(kubectl get jobs -n ${{ parameters.chartNamespace }} -o json | \
          jq -r '.items[] | select(.metadata.annotations."helm.sh/hook" == "test") | select(.metadata.name | startswith("${{ parameters.chartReleaseName }}")) | .metadata.name')
      fi

      if [ -n "$TEST_JOBS" ]; then
        # Job-based tests
        for job in $TEST_JOBS; do
          echo "--- Logs from job: $job ---"
          kubectl logs -n ${{ parameters.chartNamespace }} -l "job-name=$job" --tail=-1 --ignore-errors=true
        done
      else
        # Pod-based tests (legacy or no jobs found)
        TEST_PODS=$(kubectl get pods -n ${{ parameters.chartNamespace }} \
          -l "app.kubernetes.io/instance=${{ parameters.chartReleaseName }}" \
          -o json | jq -r '.items[] | select(.metadata.annotations."helm.sh/hook" == "test") | .metadata.name')

        if [ -n "$TEST_PODS" ]; then
          for pod in $TEST_PODS; do
            echo "--- Logs from pod: $pod ---"
            kubectl logs -n ${{ parameters.chartNamespace }} $pod --ignore-errors=true
          done
        else
          echo "No test jobs or pods found for release ${{ parameters.chartReleaseName }}"
        fi
      fi

      echo "==================================================="
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Helm Test"

  - script: helm delete --namespace ${{ parameters.chartNamespace }} ${{ parameters.chartReleaseName }} --wait || true
    condition: and(succeeded(), eq('${{ parameters.createNamespace }}', 'true'))
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Delete test Chart"

  - script: |
      echo "Deleting namespace ${{ parameters.chartNamespace }} created by this validation run."
      kubectl delete namespace ${{ parameters.chartNamespace }}
    condition: and(succeeded(), eq('${{ parameters.createNamespace }}', 'true'), eq(variables['namespaceCreatedByPipeline'], 'true'))
    workingDirectory: $(System.DefaultWorkingDirectory)/$(buildRepoSuffix)
    displayName: "Delete validation namespace"
