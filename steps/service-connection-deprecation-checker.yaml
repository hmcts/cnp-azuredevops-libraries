---
parameters:
  - name: serviceConnections
    type: object
    default: []
  - name: kvConnectedServiceName
    default: 'azurerm-sandbox'
  - name: slackNotificationsEnabled
    type: string
    default: 'true'
  - name: deprecationMapRef
    type: string
    default: master

steps:
  - script: |
      set -euo pipefail
      map_directory=$(mktemp -d "$(Agent.TempDirectory)/service-connection-deprecation-map.XXXXXX")
      git clone --depth 1 --branch "${{ parameters.deprecationMapRef }}" \
        https://github.com/hmcts/cnp-deprecation-map.git "$map_directory"
      echo "##vso[task.setvariable variable=serviceConnectionDeprecationMapDirectory]$map_directory"
    displayName: Clone deprecation map

  - task: AzureKeyVault@2
    displayName: Retrieve Slack webhook URL from Key Vault
    inputs:
      runAsPreJob: false
      ConnectedServiceName: ${{ parameters.kvConnectedServiceName }}
      keyVaultName: 'infra-vault-nonprod'
      secretsFilter: 'registry-slack-webhook'

  - ${{ each serviceConnection in parameters.serviceConnections }}:
    - task: AzureCLI@2
      displayName: 'ADO service connection nagger: ${{ serviceConnection }}'
      inputs:
        azureSubscription: ${{ serviceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          python3 "$(System.DefaultWorkingDirectory)/cnp-azuredevops-libraries/scripts/ado-service-connection-nagger.py" \
            --filepath "$(serviceConnectionDeprecationMapDirectory)/nagger-versions.yaml" \
            --service-connection "$SERVICE_CONNECTION" \
            --slack-notifications "${{ parameters.slackNotificationsEnabled }}"
      env:
        SERVICE_CONNECTION: ${{ serviceConnection }}
        SLACK_WEBHOOK_URL: $(registry-slack-webhook)
        BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
        BUILD_BUILDURI: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
        BUILD_SOURCEVERSIONAUTHOR: $(Build.SourceVersionAuthor)
