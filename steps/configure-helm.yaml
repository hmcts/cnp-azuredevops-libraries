parameters:
  serviceConnection: ''

steps:

- template: ./service-connection-deprecation-checker.yaml
  parameters:
    serviceConnections:
      - ${{ parameters.serviceConnection }}

- template: ../tasks/install-helm.yaml

- template: ../tasks/initialise-helm-client.yaml
  parameters:
    serviceConnection: ${{ parameters.serviceConnection }}

- template: ../tasks/configure-helm-acr.yaml
  parameters:
    serviceConnection: ${{ parameters.serviceConnection }}