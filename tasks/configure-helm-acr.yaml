parameters:
  serviceConnection: ''

steps:
- template: ./service-connection-deprecation-checker.yaml
  parameters:
    serviceConnections:
      - ${{ parameters.serviceConnection }}
      - ${{ if and(ne(parameters.backendServiceConnection, ''), ne(parameters.backendServiceConnection, parameters.serviceConnection)) }}:
          - ${{ parameters.backendServiceConnection }}
    kvConnectedServiceName: ${{ parameters.kvConnectedServiceName }}

- task: AzureCLI@2
  displayName: 'Configure Helm with ACR'
  enabled: true
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptLocation: 'inlineScript'
    scriptType: 'bash'
    inlineScript: |
      ACR_NAME=hmctssandbox
      az acr login --name $ACR_NAME
      helm repo add $ACR_NAME https://$ACR_NAME.azurecr.io/helm/v1/repo