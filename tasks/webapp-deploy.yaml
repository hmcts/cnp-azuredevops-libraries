parameters:
  serviceConnection: ''

steps:
- template: ./service-connection-deprecation-checker.yaml
  parameters:
    serviceConnections:
      - ${{ parameters.serviceConnection }}
      - ${{ if and(ne(parameters.backendServiceConnection, ''), ne(parameters.backendServiceConnection, parameters.serviceConnection)) }}:
          - ${{ parameters.backendServiceConnection }}
    kvConnectedServiceName: ${{ parameters.kvConnectedServiceName }}

- task: AzureRmWebAppDeployment@4
  inputs:
    connectionType: 'AzureRM'
    azureSubscription: ${{ parameters.serviceConnection }}
    appType: 'webAppContainer'
    webAppName: 'cnp-vsts-tf-test2'
    #deployToSlotOrASE: false # Optional
    #resourceGroupName: # Required when deployToSlotOrASE == True
    #slotName: 'production' # Required when deployToSlotOrASE == True
    dockerNamespace: 'hmctssandbox.azurecr.io'
    dockerRepository: 'hmcts/cnp-rhubarb-recipes-service'
    dockerImageTag: 'azure-pipelines'
    #appSettings: # Optional