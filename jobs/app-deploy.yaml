parameters:
  serviceConnection: ''

jobs:
- job: AppDeploy
  dependsOn: JavaBuild
  pool:
    name: 'mgmt-aks-sandbox'
    demands:
    - agent.name -equals $(projectName)-$(Build.BuildId)

  steps:
  - template: ../steps/service-connection-deprecation-checker.yaml
    parameters:
      serviceConnections:
        - ${{ parameters.serviceConnection }}

  - script: 'env'
    displayName: 'Display Environment Variables'

  - template: ../tasks/webapp-deploy.yaml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}
