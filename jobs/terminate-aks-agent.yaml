parameters:
  serviceConnection: ''

jobs:
- job: TerminateAgent
  dependsOn: JavaBuild
  condition: always()
  pool:
    name: 'Hosted Ubuntu 1604'

  steps:
  - checkout: none

  - template: ./service-connection-deprecation-checker.yaml
    parameters:
      serviceConnections:
        - ${{ parameters.serviceConnection }}
        - ${{ if and(ne(parameters.backendServiceConnection, ''), ne(parameters.backendServiceConnection, parameters.serviceConnection)) }}:
            - ${{ parameters.backendServiceConnection }}
      kvConnectedServiceName: ${{ parameters.kvConnectedServiceName }}

  - template: ../steps/configure-helm.yaml
    parameters:
      serviceConnection: ${{ parameters.serviceConnection }}

  - task: HelmDeploy@0
    displayName: 'Delete Agent'
    enabled: true
    inputs:
      connectionType: $(kubectlConnectionType)
      azureSubscription: ${{ parameters.serviceConnection }}
      azureResourceGroup: $(aksResourceGroup)
      kubernetesCluster: $(clusterName)
      command: 'delete'
      arguments: '--purge $(agentName)'